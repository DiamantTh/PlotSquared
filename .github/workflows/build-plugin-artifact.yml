name: Build plugin JAR

on:
  workflow_dispatch:
    inputs:
      version_ref:
        description: Upstream release tag to build (for example 7.6.0)
        required: true
        default: 7.6.0
        type: string

permissions:
  contents: read

jobs:
  build-plugin:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: IntellectualSites/PlotSquared
          ref: ${{ inputs.version_ref || github.ref }}

      - name: Setup Java
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 25

      - name: Build Bukkit plugin JAR
        run: ./gradlew clean :plotsquared-bukkit:shadowJar

      - name: Upload plugin JAR
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: PlotSquared-${{ inputs.version_ref || github.sha }}
          path: Bukkit/build/libs/PlotSquared-*.jar
          if-no-files-found: error
          retention-days: 14
