name: Build plugin JAR

on:
  workflow_dispatch:
    inputs:
      version_ref:
        description: Branch, tag, or commit to build (for example 7.6.0)
        required: true
        default: 7.6.0
        type: string

permissions:
  contents: read

jobs:
  build-plugin:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.version_ref || github.ref }}

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - name: Build Bukkit plugin JAR
        run: ./gradlew clean :plotsquared-bukkit:shadowJar

      - name: Upload plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: PlotSquared-${{ inputs.version_ref || github.sha }}
          path: Bukkit/build/libs/PlotSquared-*.jar
          if-no-files-found: error
          retention-days: 14
